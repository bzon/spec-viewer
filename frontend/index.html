<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spec-viewer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 576 512'%3E%3Cpath fill='%23e5e7eb' d='M249.6 471.5c10.8 3.8 22.4-4.1 22.4-15.5V78.6c0-4.2-1.6-8.4-5-11C247.4 52 202.4 32 144 32C93.5 32 46.3 45.3 18.1 56.1C6.8 60.5 0 71.7 0 83.8V426.4c0 18.2 19.4 29.7 36.1 23.4C62.3 439.6 96 432 144 432c37.1 0 77.1 11.3 105.6 39.5zM288 78.6V456c0 11.5 11.6 19.3 22.4 15.5C338.9 443.3 378.9 432 416 432c48 0 81.7 7.6 107.9 17.8c16.7 6.3 36.1-5.2 36.1-23.4V83.8c0-12.1-6.8-23.3-18.1-27.6C514.7 45.3 482.5 32 432 32c-58.4 0-103.4 20-123 35.6c-3.3 2.6-5 6.8-5 11z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/base.css">
  <link id="theme-css" rel="stylesheet" href="/css/themes/github-light.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar-left" id="file-list">
      <div class="sidebar-label">Files</div>
      <div id="files"></div>
    </aside>
    <main class="content" id="content">
      <div id="rendered"></div>
    </main>
    <aside class="sidebar-right">
      <div class="sidebar-label">On this page</div>
      <nav id="toc"></nav>
      <div class="annotation-tools">
        <button id="highlight-toggle" type="button" aria-pressed="false" title="Toggle highlighter (H)">
          <span>Highlight</span>
          <kbd>H</kbd>
        </button>
        <section class="comments-panel" aria-labelledby="comments-heading">
          <h2 id="comments-heading" class="sidebar-label">Comments</h2>
          <p id="comments-empty" class="comments-empty">No comments yet</p>
          <ul id="comments-list" class="comments-list" hidden></ul>
          <button id="copy-feedback" type="button" disabled title="Copy a short reply with your new comments to paste into the agent's terminal; marks them as sent">Copy feedback</button>
          <button id="copy-prompt" type="button" disabled title="Copy a longer, self-contained prompt (file path, comment ids, how to reply) for an agent that has not seen this document">Copy prompt</button>
        </section>
        <button id="clear-annotations" type="button" disabled title="Remove every highlight and comment in this document">Clear all</button>
        <div id="annotation-status" role="status" aria-live="polite"></div>
      </div>
      <p id="live-reload-hint" class="live-reload-hint" hidden title="Changes to files in this folder will not appear on their own. Reload the page to pick them up.">Live reload is off for this folder (too many files).</p>
      <div class="theme-switcher">
        <label class="sidebar-label" for="theme-select">Theme</label>
        <select id="theme-select" aria-label="Select theme"></select>
      </div>
      <div class="app-brand">spec-viewer</div>
    </aside>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
